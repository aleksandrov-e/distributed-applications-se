<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="gallery.css">
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css'>
  <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js'></script>
  <title>Document</title>
</head>
<script>
    window.onload = () => {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const navUser = document.createElement('div');
        navUser.style.cssText = 'display:flex;align-items:center;gap:15px;margin-left:auto;';
        let html = `<span style="color:white;font-size:13px">👤 ${user.username}</span>`;
        if (user.role === 'admin') {
            html += `<a href="admin-dashboard.html" style="padding:8px 18px;background:transparent;color:#c8a96e;border:2px solid #c8a96e;border-radius:6px;font-size:13px;font-weight:500;text-decoration:none;">Admin Panel</a>`;
        }
        html += `<button onclick="localStorage.clear();window.location.href='login.html'" style="padding:8px 18px;background:#c8a96e;color:white;border:none;border-radius:6px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:13px;">Logout</button>`;
        navUser.innerHTML = html;
        document.querySelector('.header-container').appendChild(navUser);
    };
</script>
<body>
  <div class="header-container">
    <a href="index.html"><img src="images/uva_nestum_logo__1_-removebg-preview.png" alt="Logo"></a>
  </div>
  <div class="title">
    <h1 class="text-center mb-0">Lightbox Gallery with Videos</h1>
  </div>
  <section class="photo-gallery">
    <div class="container">
      <div class="row g-4">
        
        <div class="col-12 col-sm-6 col-md-4">

              Your browser does not support the video tag.
            </video>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <a class="gallery-item" href="https://www.andrey-andreev.com/wp-content/uploads/2019/06/IMGP1324-2.jpg">
            <img src="https://www.andrey-andreev.com/wp-content/uploads/2019/06/IMGP1324-2.jpg" class="img-fluid" alt="Ipsum lorem dolor sit amet">
          </a>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <div class="video-item">
            <video controls>
              <source src="videos/experience-luxury-and-comfort-at-uva-nestum-wine-spa-hotel.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <a class="gallery-item" href="https://cf.bstatic.com/xdata/images/hotel/max1024x768/373199909.jpg?k=7615a993f85870196df49822a97bf71e42a81f00d7c77ae11fbe02a3b11e3829&o=&hp=1">

          </a>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <a class="gallery-item" href="https://www.andrey-andreev.com/wp-content/uploads/2019/06/IMGP0991-1.jpg">
            <img src="https://www.andrey-andreev.com/wp-content/uploads/2019/06/IMGP0991-1.jpg" class="img-fluid" alt="Cityscape View">
          </a>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <a class="gallery-item" href="https://cf.bstatic.com/xdata/images/hotel/max1024x768/373204983.jpg?k=7d5ec3f1ed909afb7a4d931b366d4c231f67d2fbf2dd1f07a511c6d7f5a092cf&o=&hp=1">

        </div>

        
        <div class="col-12 col-sm-6 col-md-4">
          <a class="gallery-item" href="https://www.uvanestum.com/_upl/gallery/uva_nestum_wine___spa_deluxe_room.jpg">
            <img src="https://www.uvanestum.com/_upl/gallery/uva_nestum_wine___spa_deluxe_room.jpg" class="img-fluid" >

        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <div class="video-item">
            <video controls>

        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <a class="gallery-item" href="https://cf.bstatic.com/xdata/images/hotel/max1024x768/373204993.jpg?k=e535db110348bc5fe4dbe82b97fbc564e7959fb9646fe838cb1f4490b7cea271&o=&hp=1">

          </a>
        </div>
      </div>
    </div>
  </section>

  <div class="modal fade lightbox-modal" id="lightbox-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen">
      <div class="modal-content">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        <div class="modal-body">
          <div class="lightbox-content">
        
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const galleryItems = document.querySelectorAll(".gallery-item");
      const modal = document.getElementById("lightbox-modal");
      const modalContent = modal.querySelector(".lightbox-content");

      galleryItems.forEach(item => {
        item.addEventListener("click", event => {
          event.preventDefault();
          const imgSrc = item.getAttribute("href");
          modalContent.innerHTML = `<img src="${imgSrc}" alt="">`;
          const bsModal = new bootstrap.Modal(modal);
          bsModal.show();
        });
      });
    });
  </script>
</body>
</html>
